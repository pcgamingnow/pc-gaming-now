name: PC GAMING NOW Daily Update

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update news
        run: python scripts/fetch_news.py

      - name: Commit news
        run: |
          git config user.name "PC GAMING NOW Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: daily news update"
          git push
